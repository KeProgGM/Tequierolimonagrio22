<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }



        thead,
        tbody {
            display: block;
            border: 1px solid #ccc;
            align-items: center;
            padding: 10px;
        }

        thead {
            background-color: #f2f2f2;
        }

        tr {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }

        th {
            flex: 1;
            text-align: left;
            padding: 10px;
        }

        td {
            width: 50%;
            flex: 1;
            padding: 10px;
        }

        form {
            margin-top: 20px;
            background-color: #f2f2f2;
            padding: 20px;
        }
        input{
            border-radius: 5px;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .button {
            background-color: #827ae7;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Medicos</h1>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Especialidad</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody >
             <tr>
                <td>Dr. Zair Matazano</td>
                <td>Cardiología</td>
                <td>5555-1234</td>
            </tr>
            <tr>
                <td>Dra. Laura cuevas</td>
                <td>Dermatología</td>
                <td>5555555-5678</td>
        </tbody>
    </table>
    
    <form>
        <h2>Agregar Médico</h2>
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="especialidad">Especialidad:</label>
        <input type="text" id="especialidad" name="especialidad" required><br><br>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required><br><br>

        <input class="button" type="submit" value="Agregar Médico">
    
</body>
</html>
