        }

            background-color: #f2f2f2;
        }

            display: flex;
            justify-content: space-between;

        }

            flex: 1;
            text-align: left;
            padding: 10px;
        }

        td {
            width: 50%;
            flex: 1;
            padding: 10px;
        }

        form {
            margin-top: 20px;

        }
        input{

        }
        .button {
            background-color: #827ae7;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
